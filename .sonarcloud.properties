# SonarCloud configuration (committed, not UI state — one path for every repo and
# every maintainer, matching the .codacy.yaml decision).
#
# Django migrations are GENERATED, not authored. Every model tracked by
# django-simple-history emits its field list twice in the same migration — once for the
# model and once for its `historical` twin — so copy-paste detection reads a routine
# migration as ~50% duplicated. That duplication is inherent to the generator and cannot
# be refactored away without hand-editing generated code, which is worse.
#
# Scoped deliberately to duplication only (`sonar.cpd.exclusions`), NOT `sonar.exclusions`:
# migrations still get bug, vulnerability and code-smell analysis. A real defect in a
# migration is a real defect; a generator repeating itself is not.
sonar.cpd.exclusions=**/migrations/**

# FILENAME MATTERS. SonarCloud has two analysis modes reading two different files:
#   sonar-project.properties  — CI-based analysis (a scanner step in a workflow)
#   .sonarcloud.properties    — Automatic Analysis (SonarCloud reads the repo itself)
# This project uses Automatic Analysis, so the first name is inert. Committed under the
# first name on 2026-08-28 and confirmed ignored: the settings API returned an empty set
# and the duplication gate stayed red.
